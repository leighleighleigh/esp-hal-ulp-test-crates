[package]
name = "shared"
version = "0.4.0"
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "shared"
test = false
bench = false

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]
test = false
bench = false

[dependencies]
cfg-if = "1.0.4"
critical-section = "1.2.0"
defmt = { version = "1.1", optional = true }

# BEGN CLI utility deps
clap = { version = "4", features = ["derive", "unicode"], optional = true }
comfy-table = { version = "7.1", optional = true }
clap-num = { version = "1.2.0", optional = true }
embedded-hal = "1.0.0"
num-traits = { version = "0.2.19", default-features = false }
object = { version = "0.41.0", optional = true }
# END CLI utility deps

[features]
default = []
defmt = ["dep:defmt"]

# Enabled for the CLI program
cli = ["dep:clap", "dep:comfy-table", "dep:object", "dep:clap-num"]

# Must be enabled for ULP/LP cores
is-lp-core = []


