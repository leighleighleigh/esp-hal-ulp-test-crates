[build]
target = "xtensa-esp32s3-none-elf"

[target.'cfg(target_arch = "riscv32")']
runner = "probe-rs run"
rustflags = [
    "-C", "link-arg=-Tlinkall.x",
    "-C", "link-arg=-Tembedded-test.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "force-frame-pointers"
]

[target.'cfg(target_arch = "xtensa")']
runner = "probe-rs run"
rustflags = [
    "-C", "link-arg=-Wl,-Tlinkall.x",
    "-C", "link-arg=-Tembedded-test.x",
    "-C", "link-arg=-Tdefmt.x",
    "-C", "link-arg=-nostartfiles",
]

[env]
# CHANGE THE TEST LOGGING LEVEL HERE!!!
DEFMT_LOG = "debug,integration=debug,embedded_test=off,esp_hal=off"
ESP_LOG = "debug,integration=debug,embedded_test=off,esp_hal=off"

[unstable]
build-std = ["core", "alloc"]

[net]
git-fetch-with-cli = true
