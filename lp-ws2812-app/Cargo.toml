[package]
name = "lp-ws2812-app"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"

[[bin]]
path = "src/main.rs"
name = "lp_rainbow"
test = false
bench = false

[dependencies]
cfg-if = "1"
embedded-hal = "1.0.0"
panic-halt = "1.0.0"

# LP HAL from esp-hal
# which will need a chip feature-flag specified,
# in order to provide the right linker script.
esp-lp-hal = { version = "0.3.0" }
riscv-rt = { version = "0.18.0", default-features = false }
ws2812-esp32s3-ulp = { git = "https://github.com/leighleighleigh/ws2812-esp32s3-ulp-rs.git", version = "0.1.0" }
smart-leds = { version = "0.4.0" }
critical-section = "1.2.0"

[build-dependencies]
esp-metadata-generated = { version = "0.5.1", features = ["build-script"] }

[features]
default = [] 
esp32s3 = ["esp-metadata-generated/esp32s3", "esp-lp-hal/esp32s3" ]
esp32s2 = ["esp-metadata-generated/esp32s2", "esp-lp-hal/esp32s2" ]
esp32c6 = ["esp-metadata-generated/esp32c6", "esp-lp-hal/esp32c6" ]

[profile.release]
debug = false
strip = "debuginfo"
# size is an important factor in the ULP code,  because it's easy to run out of space.
opt-level = "s" 
codegen-units = 1 # LLVM can perform better optimizations using a single thread
lto = false

[patch.crates-io]
esp-lp-hal = { git = "https://github.com/leighleighleigh/esp-hal", branch = "lp-riscv-interrupts" }
#esp-lp-hal = { path = "/home/leigh/Git/esp-hal/esp-lp-hal" }
